<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Sidequest</title>
</head>
<body>
    <h1>Sidequesti küsitlus</h1>
    <p>Vasta järgmistele küsimustele, et aidata meil paremini mõista sinu eelistusi ja vajadusi.</p>
</body></html>
<form></form>
<fieldset>
    <legend>1.Millises tujus sa oled?</legend>
    <label>
        <input type="radio" name="tujus" value="a">
        a. Tahaks sõpradega midagi koos teha
    </label>
    <label>
        <input type="radio" name="tujus" value="b">
        b. Tahaks rahulikku vaheldust
    </label>
    <label>
        <input type="radio" name="tujus" value="c">
        c. Tahaks väljakutset, midagi, mis paneb mind proovile
    </label>
    <label>
        <input type="radio" name="tujus" value="d">
        d. Ma ei tea, tahaks lihtsalt mingit põnevat tegevust
    </label>
    <label>
        <input type="radio" name="tujus" value="e">
        e. Tahaks keskkonnamuutust
    </label>
</fieldset>
<fieldset>
    <legend>2.Kui julge sa oled?</legend>
    <label>
        <input type="radio" name="julge" value="a">
        a. Mõõdukalt julge, päris pea ees vette ei hüppa 
    </label>
    <label>
        <input type="radio" name="julge" value="b">
        b. Pigem olen tagasihoidlik / ei soovi sotsiaalset pinget
    </label>
    <label>
        <input type="radio" name="julge" value="c">
        c. !Väga!
    </label>
    <label>
        <input type="radio" name="julge" value="d">
        d. Suhtlen kõigiga vabalt
    </label>
    <label>
        <input type="radio" name="julge" value="e">
        e. Pole mingi parameeter minu jaoks
    </label>
</fieldset>
ˇ<fieldset>
    <legend>3.Kui väga sa tahad liikuvat tegevust?</legend>
    <label>
        <input type="radio" name="pingutus" value="a">
        a. Pigem võiks ikka midagi liikuvamat/ tegusamat teha
    </label>
    <label>
        <input type="radio" name="pingutus" value="b">
        b. Eelistan midagi rahulikku
    </label>
    <label>
        <input type="radio" name="pingutus" value="c">
        c. Tahan liikuda, tahan teha
    </label>
    <label>
        <input type="radio" name="pingutus" value="d">
        d. Võin liikuda, mitte midagi kontimurdvat
    </label>
    <label>
        <input type="radio" name="pingutus" value="e">
        e. Tahan liikuda, tahan avastada
    </label>
</fieldset>
<fieldset>
    <legend>4. Kui sotsiaalset tegevust sa tahad?</legend>
    <label>
        <input type="radio" name="sotsiaalsus" value="a">
        a. Sotsiaalset(!), aga jätaks asja tuttavate sekka
    </label>
    <label>
        <input type="radio" name="sotsiaalsus" value="b">
        b. Võiks olla individuaalne ja rahulik/ tahan vaid sõbra kõrvale võtta
    </label>
    <label>
        <input type="radio" name="sotsiaalsus" value="c">
        c. Ikka sotsiaalset, sõbrad on nagunii kaasas ja vabalt kaasaks tegevuse käigus võõraid ka, mida rohkem, seda uhkem
    </label>
    <label>
        <input type="radio" name="sotsiaalsus" value="d">
        d. Olen valmis võõrastega natuke naljatama
    </label>
    <label>
        <input type="radio" name="sotsiaalsus" value="e">
        e. Ülemäära suurt suhtlust ei soovi, aga see on okei, kui mõned kokkupuuted on
    </label>
</fieldset>
<fieldset>
    <legend>5.  Kui ajamahukat tegevust sa soovid?</legend>
    <label>
        <input type="radio" name="aeg" value="a">
        a. Tähtis, et tore oleks, mul on tähtsaim, et saaksin midagi lahedat teha koos toreda seltskonnaga
    </label>
    <label>
        <input type="radio" name="aeg" value="b">
        b. Paar-kolm tundi täitsa okei / midagi, mida saan ise reguleerida
    </label>
    <label>
        <input type="radio" name="aeg" value="c">
        c. Las see sõltub minust, tahan lihtsalt lõbu ja põnevust maksimeerida
    </label>
    <label>
        <input type="radio" name="aeg" value="d">
        d. Teeks nii, et pole kindlat aega, tahan ise seda otsustada/ et valikus oleks ka mitteajamahukaid ülesandeid
    </label>
    <label>
        <input type="radio" name="aeg" value="e">
        e. Tund-paar on okei, kuniks püsin liikuvuses
    </label>
</fieldset>
<fieldset>
    <legend>6. Sees või õues? </legend>
    <label>
        <input type="radio" name="koht" value="a">
        a. Pigem sees, aga mitte niisama kodus
    </label>
    <label>
        <input type="radio" name="koht" value="b">
        b.Sees üldiselt
    </label>
    <label>
        <input type="radio" name="koht" value="c">
        c. Sees-väljas-kõikjal
    </label>
    <label>
        <input type="radio" name="koht" value="d">
        d. Saab nii väljas kui sees, sõltub minust endast
    </label>
    <label>
        <input type="radio" name="koht" value="e">
        e. Väljas
    </label>ˇ
</fieldset>
<button type="button" onclick="arvutaTulemused()">Valmis</button>
</form>
<p id="tulemus"></p>

<script>
    function arvutaTulemused() {
        const loendur = { a: 0, b: 0, c: 0, d: 0, e: 0 };
        const valitudNupud = document.querySelectorAll('input[type="radio"]:checked');

        valitudNupud.forEach(nupp => {
            const valik = nupp.value;
            if (loendur.hasOwnProperty(valik)) {
                loendur[valik]++;
            }
        });

        const tulemuseTekst = `(a: ${loendur.a}, b: ${loendur.b}, c: ${loendur.c}, d: ${loendur.d}, e: ${loendur.e})`;
        document.getElementById('tulemus').innerText = "Tulemused: " + tulemuseTekst;
    }
</script>
