<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Sidequest</title>
</head>
<body>
    <h1>Sidequesti küsitlus</h1>
    <p>Vasta järgmistele küsimustele, et aidata meil paremini mõista sinu eelistusi ja vajadusi.</p>
</body></html>
<fieldset>
    <legend>1.Millises tujus sa oled?</legend>
    <label>
        <input type="radio" name="tujus" value="sõpradega koos olemine">
        a. Tahaks sõpradega midagi koos teha
    </label>
    <label>
        <input type="radio" name="tujus" value="rahulik">
        b. Tahaks rahulikku vaheldust
    </label>
    <label>
        <input type="radio" name="tujus" value="seiklus">
        c. Tahaks väljakutset, midagi, mis paneb mind proovile
    </label>
    <label>
        <input type="radio" name="tujus" value="põnev">
        d. Ma ei tea, tahaks lihtsalt mingit põnevat tegevust
    </label>
    <label>
        <input type="radio" name="tujus" value="keskkonnamuutus">
        e. Tahaks keskkonnamuutust
    </label>
</fieldset>
<fieldset>
    <legend>2.Kui julge sa oled?</legend>
    <label>
        <input type="radio" name="julge" value="mõõdukalt julge">
        a. Mõõdukalt julge, päris pea ees vette ei hüppa 
    </label>
    <label>
        <input type="radio" name="julge" value="pigem mitte julge">
        b. Pigem olen tagasihoidlik / ei soovi sotsiaalset pinget
    </label>
    <label>
        <input type="radio" name="julge" value="väga julge">
        c. !Väga!
    </label>
    <label>
        <input type="radio" name="julge" value="keskmiselt julge">
        d. Suhtlen kõigiga vabalt
    </label>
    <label>
        <input type="radio" name="julge" value="ükskõikne">
        e. Pole mingi parameeter minu jaoks
    </label>
</fieldset>
ˇ<fieldset>
    <legend>3.Kui väga sa tahad liikuvat tegevust?</legend>
    <label>
        <input type="radio" name="pingutus" value="rohkem kui mõõdukalt">
        a. Pigem võiks ikka midagi liikuvamat/ tegusamat teha
    </label>
    <label>
        <input type="radio" name="pingutus" value="rahulik">
        b. Eelistan midagi rahulikku
    </label>
    <label>
        <input type="radio" name="pingutus" value="tegus">
        c. Tahan liikuda, tahan teha
    </label>
    <label>
        <input type="radio" name="pingutus" value="keskmiselt">
        d. Võin liikuda, mitte midagi kontimurdvat
    </label>
    <label>
        <input type="radio" name="pingutus" value="avastav">
        e. Tahan liikuda, tahan avastada
    </label>
</fieldset>
<fieldset>
    <legend>4. Kui sotsiaalset tegevust sa tahad?</legend>
    <label>
        <input type="radio" name="pingutus" value="rohkem kui mõõdukalt">
        a. Sotsiaalset(!), aga jätaks asja tuttavate sekka
    </label>
    <label>
        <input type="radio" name="pingutus" value="rahulik">
        b. Võiks olla individuaalne ja rahulik/ tahan vaid sõbra kõrvale võtta
    </label>
    <label>
        <input type="radio" name="pingutus" value="tegus">
        c. Ikka sotsiaalset, sõbrad on nagunii kaasas ja vabalt kaasaks tegevuse käigus võõraid ka, mida rohkem, seda uhkem
    </label>
    <label>
        <input type="radio" name="pingutus" value="keskmiselt">
        d. Olen valmis võõrastega natuke naljatama
    </label>
    <label>
        <input type="radio" name="pingutus" value="avastav">
        e. Ülemäära suurt suhtlust ei soovi, aga see on okei, kui mõned kokkupuuted on
    </label>
</fieldset>
<fieldset>
    <legend>5.  Kui ajamahukat tegevust sa soovid?</legend>
    <label>
        <input type="radio" name="pingutus" value="rohkem kui mõõdukalt">
        a. Tähtis, et tore oleks, mul on tähtsaim, et saaksin midagi lahedat teha koos toreda seltskonnaga
    </label>
    <label>
        <input type="radio" name="pingutus" value="rahulik">
        b. Paar-kolm tundi täitsa okei / midagi, mida saan ise reguleerida
    </label>
    <label>
        <input type="radio" name="pingutus" value="tegus">
        c. Las see sõltub minust, tahan lihtsalt lõbu ja põnevust maksimeerida
    </label>
    <label>
        <input type="radio" name="pingutus" value="keskmiselt">
        d. Teeks nii, et pole kindlat aega, tahan ise seda otsustada/ et valikus oleks ka mitteajamahukaid ülesandeid
    </label>
    <label>
        <input type="radio" name="pingutus" value="avastav">
        e. Tund-paar on okei, kuniks püsin liikuvuses
    </label>
</fieldset>
<fieldset>
    <legend>6. Sees või õues? </legend>
    <label>
        <input type="radio" name="pingutus" value="rohkem kui mõõdukalt">
        a. Pigem sees, aga mitte niisama kodus
    </label>
    <label>
        <input type="radio" name="pingutus" value="rahulik">
        b.Sees üldiselt
    </label>
    <label>
        <input type="radio" name="pingutus" value="tegus">
        c. Sees-väljas-kõikjal
    </label>
    <label>
        <input type="radio" name="pingutus" value="keskmiselt">
        d. Saab nii väljas kui sees, sõltub minust endast
    </label>
    <label>
        <input type="radio" name="pingutus" value="avastav">
        e. Väljas
    </label>
